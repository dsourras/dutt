<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="theme-color" content="#ffffff">
  <title>DUTT - Ασφαλής παρακολούθηση</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f6f7f9;
      color: #121827;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: calc(100vw - 48px);
      max-width: 460px;
      padding: 28px;
      border: 1px solid #dde1e8;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 12px 32px rgba(18, 24, 39, 0.08);
    }
    img { width: 104px; height: auto; display: block; margin-bottom: 28px; }
    h1 { margin: 0 0 12px; font-size: 28px; line-height: 1.2; letter-spacing: 0; overflow-wrap: anywhere; }
    p { margin: 0; color: #6d7482; font-size: 16px; line-height: 1.55; overflow-wrap: anywhere; }
    #error { display: none; color: #a61b1b; }
  </style>
  <script src="redirect.js" defer></script>
</head>
<body>
  <main>
    <img src="../logo.png" alt="DUTT">
    <h1>Ασφαλής παρακολούθηση</h1>
    <p id="progress">Ανοίγουμε τα στοιχεία της αποστολής σας...</p>
    <p id="error">Ο σύνδεσμος δεν είναι έγκυρος. Επικοινωνήστε με την υποστήριξη DUTT.</p>
  </main>
</body>
</html>
